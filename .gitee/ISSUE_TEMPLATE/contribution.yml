name: 软件库贡献
description: 对本项目的软件库提交一个你认为需要上架的软件
title: "[软件库贡献]: "
labels: ["enhancement"]
assignees:
  - gitee
body:
  - type: markdown
    attributes:
      value: |
        感谢您的贡献，一个好的社区环境离不开您的帮助！
  - type: input
    id: related-problem
    attributes:
      label: 软件名称
      description: 您想上架的软件的名称，例如：微信   腾讯QQ   阿里云盘
    validations:
      required: true
  - type: input
    id: desired-solution
    attributes:
      label: 软件官网链接
      description: 软件官网或者仓库链接
    validations:
      required: true
  - type: dropdown
    id: classify
    attributes:
      label: 软件所属分类
      description: 你认为这个软件应该归类到哪个类别
      options:
        - 社交
        - 游戏
        - 办公
        - 开发
        - 影音
        - 工具
        - 理财
        - 阅读
    validations:
      required: true
  - type: textarea
    id: icon
    attributes:
      label: 软件图标链接或文件
      description: 软件logo的链接或者文件
    validations:
      required: true
  - type: input
    id: download
    attributes:
      label: 软件下载链接
      description: 软件下载的链接，尽量填写稳定的下载地址
    validations:
      required: true
  - type: textarea
    id: imgs
    attributes:
      label: 软件的截图
      description: 软件的内部截图，如果您有的话
    validations:
      required: false